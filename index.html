:root{--bg:#f2f5f6;--card:#fff;--tx:#17262b;--mu:#62767c;--ln:#dde5e8;--ac:#0b6e6e;--acx:#fff;--ok:#18794e;--wa:#a15c07;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a1d;--card:#182428;--tx:#e6eff1;--mu:#93a9af;--ln:#2a3b40;--ac:#4fc3c3;--acx:#0a1b1d;--ok:#4cc38a;--wa:#f0b35a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#101a1d;--card:#182428;--tx:#e6eff1;--mu:#93a9af;--ln:#2a3b40;--ac:#4fc3c3;--acx:#0a1b1d;--ok:#4cc38a;--wa:#f0b35a;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans Thai",system-ui,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:18px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button,.fb{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:8px;cursor:pointer}
button.p,.fb.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
nav button{white-space:nowrap}nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.st b{display:block;font-size:22px}.st span,.mu{color:var(--mu);font-size:13px}
.sc{overflow-x:auto}.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln);vertical-align:top}
th{color:var(--mu);font-weight:600;font-size:13px;white-space:nowrap}
tr[data-act]{cursor:pointer}tr[data-act]:hover{background:var(--bg)}
input[type=text],input[type=search],input[type=date],select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx)}
.bar{display:flex;gap:8px;margin-bottom:10px}
.tg{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.disc{font-size:12px;color:var(--mu,#62767c);text-align:center;line-height:1.5;max-width:520px;margin-left:auto;margin-right:auto}
.or{color:#c2410c}.crit{display:inline-block;color:#fff;background:var(--bad);border-radius:6px;padding:1px 7px}
tr.lv4>td:first-child,tr.lv5>td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.fu{font-size:12px;margin-top:3px;display:flex;gap:4px;flex-wrap:wrap}.fu .tg{font-size:11.5px}
.unc{border-color:var(--bad)!important;background:#fff3f3!important}.aif{background:#effaf3!important}
.vok{font-size:11.5px;padding:0 7px;margin-left:6px;color:var(--bad);border-color:var(--bad)}
.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{border:1px solid var(--ln);border-radius:10px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.fcard .th{height:110px;display:flex;align-items:center;justify-content:center;background:var(--bg);cursor:pointer}
.fcard .th img{max-width:100%;max-height:110px;object-fit:cover}.fcard .pdf{font-size:30px;font-weight:700;color:var(--bad)}
.fcard .nm{font-size:12.5px;padding:6px 8px 0;overflow-wrap:anywhere}.fcard .ac{display:flex;gap:4px;padding:6px 8px 8px;flex-wrap:wrap}.fcard .ac button{font-size:12px;padding:2px 8px}
@media (min-width:641px){body .md{align-items:center}body .md>.sh{border-radius:14px;max-height:88vh;margin:16px}}
#sh.form{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;align-content:start;padding:12px 16px}
#sh.form>*,#sh.form .fgrid>*{grid-column:1/-1}#sh.form .fld{grid-column:auto}
#sh.form .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
#sh.form [hidden]{display:none!important}
#sh.form label{margin:6px 0 1px;font-size:12.5px}
#sh.form input[type=text],#sh.form input[type=date],#sh.form select{padding:5px 9px;font-size:14px}
#sh.form h1{font-size:18px}#sh.form .card{padding:8px 10px;margin-top:8px!important}#sh.form p{margin:8px 0}
#sh.form button.p[data-act^="save"]{padding:10px!important}
@media (max-width:640px){#sh.form,#sh.form .fgrid{grid-template-columns:1fr}}
.gs{margin:10px 0 0}.gs input{font-size:16px;padding:10px 12px;border-width:2px}
.man details{border-bottom:1px solid var(--ln);padding:10px 0}.man summary{cursor:pointer;font-weight:600;font-size:16px}
.man ol,.man ul{margin:8px 0 0;padding-left:22px}.man li{margin:4px 0}.man p{margin:8px 0}.kbd{display:inline-block;padding:0 6px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);font-size:13px}
.lic{border-radius:14px;padding:14px;color:#fff;display:flex;gap:12px;align-items:flex-start;min-height:120px}
.lic.nl{background:linear-gradient(135deg,#0f5a31,#1d7a45)}.lic.lf{background:linear-gradient(135deg,#17306f,#2a4fa8)}
.lic .lg{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center}.lic.lf .lg{background:#fff;border-radius:50%}
.lic .lg img{max-width:34px;max-height:38px}.lic .t{font-size:13px;opacity:.85}.lic .no{font-size:17px;font-weight:600;letter-spacing:.5px;margin:2px 0}
.lic .st{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18)}
.lic .st.w{background:#ffd27a;color:#4a2d00}.lic .st.x{background:#ffb4ab;color:#5c0b05}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:46px;height:46px;border-radius:50%;flex:none}
.hero{text-align:center;padding:28px 12px 8px}.hero img{width:132px;height:132px;border-radius:50%}.hero h1{font-size:24px;margin-top:12px}
.tg.dn{color:var(--mu);background:var(--ln);border-color:var(--ln)}
:root{--ty1:#0f5132;--ty1b:#d7efe2;--ty2:#0b5cad;--ty2b:#dcecfb;--ty3:#a34a00;--ty3b:#fde8d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ty1:#7fd6a6;--ty1b:#163a2a;--ty2:#8cc4ff;--ty2b:#13304d;--ty3:#ffb36b;--ty3b:#43290f}}
:root[data-theme="dark"]{--ty1:#7fd6a6;--ty1b:#163a2a;--ty2:#8cc4ff;--ty2b:#13304d;--ty3:#ffb36b;--ty3b:#43290f}
.dsec{margin-top:8px}.dsec-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(127,127,127,.18);font-size:15px}.dsec .kv+.kv{margin-top:0}

.skbgate .glogo{width:84px;height:84px;display:block;margin:0 auto 6px;border-radius:50%;width:110px;height:110px}
.skbgate h1{text-align:center;margin:4px 0 2px;font-size:24px}.skbgate h1+p{text-align:center;margin:0 0 14px}
.skbgate h2{font-size:17px;margin:14px 0 4px}
.skbgate label{display:block;margin:10px 0 4px;font-size:13.5px;color:#444}
.skbgate input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cfd6dc;border-radius:10px;font:inherit}
.skbgate .gbtn{width:100%;margin-top:16px;padding:13px;font-size:16px;border-radius:12px}
.skbgate .gtab{display:flex;gap:6px;background:#f0f3f5;border-radius:12px;padding:4px}
.skbgate .gtab button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font:inherit;cursor:pointer}
.skbgate .gtab button.on{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.skbgate .gmsg{min-height:1em;margin:10px 0 0;font-size:14px}.skbgate .gmsg.bad{color:#c0392b}.skbgate .gmsg.ok{color:#1e7d4f}
.skbgate .mu{color:#6b7480}

/* ===== ธีม B · นีออนสว่าง ===== */
:root{--bg:#f6f7fe;--card:#fff;--tx:#1c1d3a;--mu:#6b6f8e;--ln:#e5e7f4;--ac:#6d4aff;--acx:#fff;--ok:#0f9f6e;--wa:#e07b00;--bad:#e5245e;--g1:#7c3aed;--g2:#06b6d4;--grad:linear-gradient(135deg,var(--g1),var(--g2))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f22;--card:#17183a;--tx:#ecebff;--mu:#a3a6cc;--ln:#2a2c55;--ac:#9d86ff;--acx:#fff;--ok:#37d39b;--wa:#ffb547;--bad:#ff5c8a}}
:root[data-theme="dark"]{--bg:#0e0f22;--card:#17183a;--tx:#ecebff;--mu:#a3a6cc;--ln:#2a2c55;--ac:#9d86ff;--acx:#fff;--ok:#37d39b;--wa:#ffb547;--bad:#ff5c8a}
.card{border-radius:16px;box-shadow:0 2px 10px rgba(99,102,241,.06)}
button,.fb{border-radius:12px}
button.p,.fb.p,nav button.on{background:var(--grad)!important;border-color:transparent!important;color:#fff!important;box-shadow:0 4px 14px rgba(124,58,237,.30)}
button.p:hover,.fb.p:hover{filter:brightness(1.07)}
nav button{border-radius:999px;padding:7px 16px}
.top .brand h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .brand img{border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(124,58,237,.55),0 4px 16px rgba(124,58,237,.35)}
h2{position:relative;padding-left:12px}h2::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:4px;background:var(--grad)}
.st>.card{position:relative;border-top:4px solid var(--c,#06b6d4);box-shadow:0 8px 22px -10px var(--c,#06b6d4)}
.st>.card b{color:var(--c,#06b6d4)}
.st>.card::after{position:absolute;right:12px;top:10px;font-size:20px;opacity:.9}
.st>.card:nth-child(1){--c:#06b6d4}.st>.card:nth-child(1)::after{content:"👥"}
.st>.card:nth-child(2){--c:#7c3aed}.st>.card:nth-child(2)::after{content:"🚗"}
.st>.card:nth-child(3){--c:#f59e0b}.st>.card:nth-child(3)::after{content:"📅"}
.st>.card:nth-child(4){--c:#ec4899}.st>.card:nth-child(4)::after{content:"💰"}
.tg{box-shadow:0 0 8px -3px currentColor}
input[type=text],input[type=search],input[type=date],input[type=email],input[type=password],select,textarea{border-radius:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g1)!important;box-shadow:0 0 0 3px rgba(124,58,237,.18)}
.gs input{box-shadow:0 2px 10px rgba(99,102,241,.08)}
#fbk{background:var(--grad)!important;box-shadow:0 6px 18px rgba(124,58,237,.4)!important}
.plate{border-color:#115f2f!important}
/* หน้าเข้าสู่ระบบ */
.skbgate{background:radial-gradient(circle at 20% 10%,rgba(124,58,237,.14),transparent 45%),radial-gradient(circle at 85% 90%,rgba(6,182,212,.16),transparent 45%),#f6f7fe}
.skbgate .gbox{box-shadow:0 12px 40px rgba(99,102,241,.16)}
.skbgate h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.skbgate .gbtn{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.35)}
.skbgate .gtab button.on{color:var(--g1)}
</style>

function licInfo(p,c){

  S('2.1 ขึ้นทะเบียนรถใหม่ / ลูกค้าใหม่ (ทีละขั้นตอน)','<p><b>ใช้เมื่อ</b> ค้นหาทะเบียนหรือชื่อแล้ว <b>ไม่พบ</b> ในระบบ · ทำตามลำดับ: <b>รถ + ลูกค้า ก่อน</b> → พ.ร.บ./ประกัน → ภาษี</p><p><b>ก. บันทึกรถ (พร้อมสร้างลูกค้าใหม่ในฟอร์มเดียว)</b></p><ol><li>ค้นหาทะเบียนในช่องค้นหาก่อนทุกครั้ง ให้แน่ใจว่ายังไม่มี (กันข้อมูลซ้ำ)</li><li>ไปแท็บ <b>รถ / ภาษี</b> → กด <span class="kbd">+ รถ</span></li><li>กด <span class="kbd">📷 อ่านจากรูป / PDF เล่มทะเบียน</span> → เลือกรูป <b>หน้ารายการจดทะเบียน</b> (ถ่ายให้ชัด ตรง ไม่เอียง) → รอ 10–60 วินาที</li><li>ช่อง <b>ลูกค้า (เจ้าของ)</b>: ลูกค้าเก่า = เลือกชื่อจากรายการ · ลูกค้าใหม่ = เลือก <b>ลูกค้าใหม่</b> แล้วกรอก ชื่อ-นามสกุล และเบอร์โทร</li><li>ช่อง <b>รหัสสมาชิก</b> ของลูกค้าใหม่: ยังไม่เป็นสมาชิก (งานแจ้งเข้ารหัสของเรา) กด <span class="kbd">ยังไม่เป็นสมาชิก (00000000)</span> · เป็นสมาชิกแล้ว ใส่รหัสที่ศรีกรุงออกให้</li><li><b>ตรวจทุกช่องเทียบกับเล่มจริง</b> โดยเฉพาะ: ทะเบียน (ตัวอักษรไทยคล้ายกัน เช่น ฒ/ฌ, ด/ต) · ชื่อผู้ครอบครองให้ตรงกับชื่อลูกค้า · เลขตัวถัง/เลขเครื่อง (O กับ 0) · ช่องที่มีกรอบเตือนสีส้ม</li><li>เลือก <b>เชื้อเพลิง</b> จาก Dropdown ถ้ายังว่าง (รถไฟฟ้าไม่ต้องกรอกเลขเครื่อง/ซีซี ถ้าเล่มไม่มี)</li><li>กด <span class="kbd">บันทึก</span> · ถ้ามีหน้าต่างเตือน ทะเบียนใกล้เคียง/ซ้ำ ให้อ่านก่อน: ถ้าเป็นคันเดียวกันให้กลับไปเปิดคันเดิม</li></ol><p><b>ข. พ.ร.บ. / ประกันรถ</b></p><ul><li><b>ยังใช้ฉบับเดิมที่ไม่ได้ซื้อกับเรา</b>: ไม่ต้องบันทึก · ถ้ากลัวลืม กด <b>📝 โน้ต</b> ที่รถ เขียนวันหมดอายุไว้</li><li><b>ลูกค้าซื้อกับเราแล้ว</b>: ค้นหาทะเบียน → เปิดหน้ารถ → กดปุ่ม <b>+ พ.ร.บ.</b> (หรือ <b>ต่ออายุพ.ร.บ.</b>) / <b>+ ประกันรถ</b> ในหน้ารถ (ระบบผูกกับรถและลูกค้าให้) → <b>📷 อ่านจากรูป</b> ตาราง พ.ร.บ./กรมธรรม์ → ตรวจ → บันทึก</li><li>ยังไม่ได้เลขกรมธรรม์ ใส่ <b>รอ</b> ไว้ก่อน ระบบจะขึ้นในการ์ด ติดตาม กธ. ที่ยังไม่ได้รับ</li></ul><p><b>ค. ภาษีรถ</b></p><ul><li>ต่อภาษีให้ลูกค้าแล้ว (หรือต่อพร้อม พ.ร.บ.): ในหน้ารถ กด <span class="kbd">+ บันทึกต่อภาษี</span> ทันที ไม่งั้นระบบจะขึ้นแดง <b>ยังไม่ต่อ</b></li><li>ยังไม่ถึงรอบ หรือรอตรวจ ตรอ.: ยังไม่ต้องกด ระบบเตือนล่วงหน้า 30 วันจากวันจดทะเบียนให้เอง</li></ul><p><b>ง. ตรวจหลังบันทึก</b></p><ul><li>เปิดหน้าลูกค้า ดูว่ามีรถ / กรมธรรม์ ผูกอยู่ครบ</li><li>มุมบนขึ้น <b>☁ ซิงก์กับบัญชีแล้ว</b> = ข้อมูลขึ้นบัญชีเรียบร้อย</li><li>ถ้ามีกรอบส้ม <b>ข้อมูลรถยังไม่ครบ</b> ในหน้ารถ กด <b>กรอกข้อมูลให้ครบ</b></li><li>ลูกค้ามี LINE: <b>แก้ไขข้อมูลลูกค้า</b> → ใส่ LINE ID หรือ 📷 อ่านจากรูป QR (ดูข้อ 4.8)</li></ul><p class="mu">สรุปสั้น: ค้นหาก่อน → + รถ → 📷 อ่านเล่ม → เลือก/สร้างลูกค้า + รหัสสมาชิก → ตรวจ → บันทึก → (ซื้อแล้ว) พ.ร.บ./ประกันจากหน้ารถ → (ต่อแล้ว) บันทึกต่อภาษี</p>')+S('3. รับชำระงวดผ่อน','<ol><li>เปิดกรมธรรม์ (จากแจ้งเตือนหรือค้นหา) → ตารางงวดชำระ</li><li>กด <span class="kbd">รับชำระ</span> ที่งวดนั้น → ตรวจชื่อ งวด ยอดเงิน → <span class="kbd">ยืนยันรับชำระ</span></li><li>ขึ้น <b>✓ รับชำระเรียบร้อยแล้ว</b> → กด ตกลง · งวดนั้นจะมีป้ายเทา "ชำระแล้ว" + วันที่รับ</li><li>กดผิด: กด <span class="kbd">ยกเลิก</span> ข้างวันที่ แล้วยืนยัน (ปุ่มแดง)</li><li>ถ้าขึ้นหน้าต่างแดง <b>"บันทึกไม่สำเร็จ"</b> ให้แคปหน้าจอส่งให้ Claude</li></ol><p class="mu">เตือนทุกงวดล่วงหน้า 3 วัน จนกว่าจะชำระครบ · วันครบกำหนด = วันเริ่มคุ้มครองของทุกเดือน</p>')+
  S('3.1 ลูกค้าที่ยังไม่จ่าย / ไม่ตอบรับการแจ้งเตือน','<p class="mu"><b>แจ้งเตือนต่ออายุ / ต่อภาษี:</b> หน้าภาพรวม ในตาราง "กรมธรรม์ที่จะหมดอายุ" และ "ภาษีรถที่ครบต่อ" กด <b>ส่งแจ้งเตือน</b> (หรือในหน้ากรมธรรม์ประกันรถ / ประกันอื่นๆ / ประกันชีวิต กด "ส่งแจ้งเตือนต่ออายุ") ระบบสร้างรูปพร้อมส่งไลน์ แยกสีตามประเภท: ต่ออายุ = น้ำเงิน, ต่อภาษี = น้ำตาล, หมดอายุแล้ว = แดง · กดแชร์หรือบันทึกรูป ระบบนับว่า "แจ้งแล้ว" ให้</p><p class="mu"><b>ใส่เบี้ยปีใหม่ในใบเตือนต่ออายุ:</b> ในหน้าต่างรูปแจ้งเตือน กรอก "เบี้ยปีใหม่" ตามใบเสนอราคา · ส่วนลดสมาชิกดึงจากตารางค่าคอม (แก้เองได้) · ติ๊ก "ไม่ให้ส่วนลดสมาชิก" เมื่อขายลูกค้าทั่วไป · เลือก "ผ่อน 2–10 งวด" ระบบคำนวณตามสูตรผ่อน (ส่วนลด − 2% − จำนวนงวด) และเตือนถ้าบริษัทไม่รับผ่อน Lucky หรือค่างวดต่ำกว่า 500 บาท · รูปจะแสดงเบี้ยปีใหม่ ช่วงคุ้มครอง ส่วนลด และยอดชำระ / งวดละ</p><p class="mu"><b>ลงงานย้อนหลัง:</b> งวดที่ลูกค้าจ่ายไปแล้วก่อนเริ่มใช้แอป ตอนกด "รับชำระ" ให้ติ๊ก <b>"จ่ายตรงเวลาแล้ว (งานย้อนหลัง)"</b> ระบบจะบันทึกวันที่ชำระเป็นวันครบกำหนด และไม่คิดค่าปรับ</p><p class="mu">มือถือแนวตั้ง: ตารางงวดผ่อน รายการกรมธรรม์ / พ.ร.บ. / ภาษี รายการรถ และตารางในหน้าภาพรวม จะแสดงเป็นการ์ดทีละรายการ อ่านได้โดยไม่ต้องเลื่อนซ้าย-ขวา · หมุนเป็นแนวนอนจะกลับเป็นตาราง</p><p>หน้า <b>แจ้งเตือน</b> เรียงจากเร่งด่วนที่สุดไว้บนสุด:</p><ul><li><span class="wa">เหลือง</span> ใกล้ครบกำหนด (3 วันก่อน) → ส่งรูปแจ้งเตือนทางไลน์</li><li><span class="or">ส้ม</span> ครบกำหนดวันนี้ → ส่งไลน์ซ้ำ</li><li><span class="bad">แดง</span> เลยกำหนด 1–7 วัน · ค่าปรับ 200 บาท → <b>โทรตาม</b></li><li><span class="crit">เสี่ยงยกเลิก</span> เลยกำหนด 8–14 วัน · ค่าปรับ 500 บาท · มีแถบแดงหน้าแถว → โทรและแจ้งว่ากรมธรรม์อาจถูกยกเลิก</li><li>เกิน 14 วัน: อาจถูกยกเลิกแล้ว ให้ตรวจสอบกับบริษัท</li></ul><p class="mu">ค่าปรับคิดตั้งแต่งวดที่ 2 เป็นต้นไป · ยอดรวมค่าปรับแสดงในแถวและในรูปแจ้งเตือนให้อัตโนมัติ</p><ol><li><b>นับครั้งที่แจ้ง:</b> ทุกครั้งที่กด <span class="kbd">แชร์ไปไลน์</span> หรือ <span class="kbd">บันทึกรูป</span> ระบบนับให้ (ถ้าคัดลอกรูปเอง กด <span class="kbd">บันทึกว่าแจ้งแล้ว</span>) · แสดงเป็น "แจ้งแล้ว 2 ครั้ง · ล่าสุด …" แจ้งครบ 2 ครั้งแล้วยังไม่จ่าย ขึ้นป้าย <span class="tg bad">ไม่ตอบรับ</span></li><li><b>รูปแจ้งเตือนครั้งที่ 2 ขึ้นไป</b> หัวเปลี่ยนเป็น "แจ้งเตือนชำระ ครั้งที่ …" · ถ้าเลยกำหนดแล้ว หัวเป็นสีแดง แสดงวันที่เลย ค่าปรับ และคำเตือน</li><li><span class="kbd">โทร</span> โทรออกได้เลยบนมือถือ (ต้องมีเบอร์ลูกค้า)</li><li><span class="kbd">บันทึกผลติดตาม</span> ใส่วันที่ลูกค้า <b>นัดจ่าย</b> และหมายเหตุ (ติดต่อไม่ได้, ขอเลื่อน …) · ระหว่างรอวันนัด รายการจะเลื่อนลงล่าง · เลยวันนัดแล้วยังไม่จ่าย กลับขึ้นบนพร้อมป้าย <span class="tg bad">ผิดนัด</span></li><li>ตอน <span class="kbd">รับชำระ</span> งวดที่เลยกำหนด หน้ายืนยันจะแสดงค่าปรับและยอดรวมให้เก็บ</li><li>หน้าลูกค้าแสดง <span class="tg bad">เคยจ่ายช้า … งวด</span> ใช้ประกอบการตัดสินใจให้ผ่อนครั้งต่อไป</li><li><b>สรุปค่าปรับ</b> อยู่ใต้ยอดขายรายเดือน: ค่าปรับค้างเก็บตอนนี้ (นับเฉพาะงวดที่เลยวันครบกำหนดแล้ว) และค่าปรับที่เก็บได้แยกตามเดือนที่รับชำระ · <b>ค่าปรับไม่นับเป็นยอดขาย</b></li></ol>')+
  S('4. ส่งรูปแจ้งชำระทางไลน์ + QR','<ol><li>ครั้งแรกครั้งเดียว: ใส่ชื่อและ <b>เบอร์มือถือ</b> ในโปรไฟล์ (ตั้งค่า → แผนการตลาด → แก้ไขโปรไฟล์) เพื่อให้ขึ้นในรูป</li><li>ครั้งแรกของแต่ละคัน: เปิดกรมธรรม์ → หัวข้อ <b>QR ชำระเบี้ย</b> → <span class="kbd">+ เพิ่มรูป QR</span> เลือกรูป QR ของคันนั้น</li><li>หน้าแจ้งเตือน กด <span class="kbd">ส่งแจ้งเตือน</span> (หรือในกรมธรรม์ กด <span class="kbd">รูปแจ้งเตือน</span> ข้างงวด)</li><li>กด <span class="kbd">แชร์ไปไลน์</span> เลือก LINE · ถ้าแชร์ไม่ได้ กด <span class="kbd">บันทึกรูป</span> หรือกดค้างที่รูป แล้วส่งในไลน์</li></ol>')+
  S('4.1 เก็บไฟล์กรมธรรม์ / รูป','<ol><li>เปิดกรมธรรม์ (รถ, พ.ร.บ., ประกันอื่นๆ, ประกันชีวิต) → หัวข้อ <b>ไฟล์กรมธรรม์ / รูป</b></li><li>กด <span class="kbd">+ เพิ่มไฟล์</span> เลือก PDF หรือรูป เลือกได้หลายไฟล์พร้อมกัน · บนมือถือเลือก <b>ถ่ายรูป</b> ได้เลย (เช่น ถ่ายหน้าตารางกรมธรรม์ สำเนาทะเบียนรถ)</li><li>แตะไฟล์หรือกด <span class="kbd">เปิด</span> เพื่อดู · <span class="kbd">บันทึก</span> เพื่อดาวน์โหลดไปส่งลูกค้า · <span class="kbd">ลบ</span> (ยืนยันอีกครั้ง)</li></ol><p class="mu">ไฟล์ละไม่เกิน 20 MB · รูปขนาดใหญ่จะย่อให้อัตโนมัติ · ดูพื้นที่ที่ใช้ได้ในหน้าตั้งค่า · ไฟล์ไม่รวมอยู่ในไฟล์สำรอง (.json)</p><p><b>ครบปีแล้ว ลบไฟล์เพื่อคืนพื้นที่</b>: ตั้งค่า / คู่มือ → <b>พื้นที่ไฟล์กรมธรรม์</b> จะแสดงทุกฉบับที่หมดอายุแล้วและยังมีไฟล์ ติ๊กเลือก แล้วกด <span class="kbd">ลบไฟล์ของฉบับที่เลือก</span> · หรือเปิดกรมธรรม์ที่หมดอายุ แล้วกด <span class="kbd">ลบไฟล์ทั้งหมดของฉบับนี้</span> (ข้อมูลกรมธรรม์ยังอยู่ ลบเฉพาะไฟล์)</p>')+
  S('4.2 เพิ่มกรมธรรม์: งานใหม่ หรือ ต่ออายุ','<p>ฟอร์มเพิ่มกรมธรรม์ (รถ, พ.ร.บ., ประกันอื่นๆ, ประกันชีวิต) มีช่อง <b>ประเภทงาน</b>:</p><ul><li><b>งานใหม่</b>: ลูกค้าใหม่ รถใหม่ หรือเพิ่งย้ายมาทำกับเรา</li><li><b>ต่ออายุ</b>: ลูกค้าเดิมต่อปีถัดไป</li></ul><p><b>ไม่ต้องกรอกกรมธรรม์ปีเก่าก่อน</b> ถ้าลูกค้าต่อปีแล้ว กด <span class="kbd">+ กรมธรรม์</span> กรอกฉบับใหม่ได้เลย แล้วเลือก "ต่ออายุ" · ถ้าในระบบมีฉบับเก่าของรถคันเดียวกัน ระบบจะผูกให้อัตโนมัติ และฉบับเก่าจะหายจากรายการใกล้หมดอายุ</p><p><b>กันข้อมูลซ้ำ</b>: ถ้าเลขกรมธรรม์ตรงกับที่มีอยู่ หรือทะเบียนกับวันเริ่มคุ้มครองตรงกัน หน้ายืนยันจะขึ้นกรอบแดง <b class="bad">⚠ อาจซ้ำกับฉบับที่มีอยู่แล้ว</b> ให้ตรวจก่อนกดยืนยัน · ถ้าเลือก "งานใหม่" แต่รถคันนี้เคยมีกรมธรรม์กับเรา ระบบจะเตือนให้เปลี่ยนเป็น "ต่ออายุ"</p><p class="mu">ประเภทงานแสดงเป็นป้ายในหน้ารายละเอียด และในรายการยอดขายรายเดือน</p>')+
  S('4.2.1 ส่วนลดสมาชิกจากตารางค่าคอม','<ol><li>ฟอร์มกรมธรรม์: เลือกบริษัท ชั้นประกัน <b>การซ่อม (อู่/ห้าง)</b> ช่องทาง และใส่ <b>วันที่ลูกค้าชำระ</b></li><li>ช่อง <b>ส่วนลดสมาชิก (%)</b> จะเติมจากตารางค่าคอมของเดือนที่ลูกค้าชำระให้เอง ใต้ช่องบอกว่ามาจากตารางไหน · พิมพ์แก้เองได้ (ระบบจะไม่เขียนทับ) กด <span class="kbd">ใช้ …%</span> เพื่อกลับไปใช้ค่าจากตาราง</li><li>งานผ่อน: เลือก <b>ผ่อนชำระ</b> แล้วใส่<b>จำนวนงวด</b> ระบบคำนวณยอดโอนต่องวดจากส่วนลดนี้ตามสูตรศรีกรุง (× 0.9309 หักส่วนลด 2% + 1% ต่องวด ปัดขึ้น)</li></ol><p class="mu">ตารางเปลี่ยนทุกเดือน ส่งไฟล์ PDF ให้ Claude อัปเดต · ถ้ายังไม่มีตารางเดือนนั้น ใช้เดือนที่ใกล้ที่สุด</p><p class="mu">ในหน้าตารางค่าคอม เลือกบริษัทจาก Dropdown <b>บริษัทประกันภัย</b> เพื่อดูเฉพาะบริษัทนั้น · กด <b>แสดงทุกบริษัท</b> เพื่อกลับ</p>')+
  S('4.4 ติดตาม กธ. ที่ยังไม่ได้รับ','<ul><li>หน้า <b>ภาพรวม</b> มีการ์ด <b>ติดตาม กธ. ที่ยังไม่ได้รับ</b> (ใต้ตัวเลขสรุป) บอกจำนวนงานที่รอ และรอนานสุดกี่วัน · กดการ์ดเพื่อเปิดหน้ารายการ ตามงานเสร็จกด <span class="kbd">ปิด</span> หรือปุ่มย้อนกลับ (←) · กดรายการเพื่อเปิดดูกรมธรรม์ แล้วกด ← จะกลับมาที่หน้ารายการ</li><li>หน้ารายการแสดงกรมธรรม์รถ / พ.ร.บ. / ประกันอื่นๆ / ประกันชีวิต ที่เลขกรมธรรม์ยังว่าง หรือใส่ไว้ชั่วคราว เช่น 00 หรือ รอ (และยังไม่หมดอายุ)</li><li>เรียงจากรอนานสุด · ช่อง <b>รอมาแล้ว</b> นับจากวันที่ลูกค้าชำระ (ถ้าไม่ได้ใส่ นับจากวันที่บันทึก) · ป้ายเหลือง = 7 วันขึ้นไป · ป้ายแดง = 14 วันขึ้นไป</li><li>โทรตาม/ทักบริษัทแล้ว กด <span class="kbd">ตามแล้ว</span> ระบบจำวันที่ไว้ในช่อง <b>ตามล่าสุด</b></li><li>ได้เลขกรมธรรม์แล้ว: กดแถวนั้น → <span class="kbd">แก้ไขกรมธรรม์</span> → ใส่เลข (หรือ 📷 อ่านจากไฟล์ ข้อ 7.3) → บันทึก รายการจะหายจากการ์ดเอง</li><li>รายการที่ไม่ต้องติดตาม (เช่น งานเก่าที่ไม่มีเลข) กด <span class="kbd">ไม่ต้องตาม</span> เพื่อเอาออกจากการ์ด</li><li>ถ้าไม่มีรายการค้าง การ์ดนี้จะไม่แสดง</li></ul>')+
  S('4.4.1 แท็บแจ้งเตือน: รวมงานที่ต้องตาม','<ul><li>แท็บ <b>แจ้งเตือน</b> (เลขสีแดง) รวมงานที่ต้องตามทั้งหมดไว้ที่เดียว: งวดผ่อนเร่งด่วน · บัตรนายหน้าใกล้หมด · <b>กรมธรรม์ / พ.ร.บ. ที่จะหมดอายุภายใน 45 วัน</b> · <b>ภาษีรถที่ครบต่อภายใน 30 วัน</b> (ด่วนเมื่อเหลือ 15 วัน) · งวดผ่อนที่จะครบใน 30 วัน</li><li>เลขสีแดงนับรวมทุกอย่างข้างต้น · ด้านบนมีป้ายสรุปจำนวนแต่ละแบบ</li><li><b>รายการต่ออายุแสดงเป็นการ์ด</b> (แบบแอปบริษัท): ประเภท · ป้าย <b>งานของฉัน</b> หรือ <b>งานของลูกทีม · ชื่อ</b> · <b>เหลือ X วัน</b> (แดง ≤7 วัน, ส้ม ≤30 วัน) · ป้ายทะเบียน + ยี่ห้อ/รุ่น · ผู้เอาประกัน · เลขที่ · วันหมดอายุ · บริษัท · เบี้ยเดิม</li><li>แตะที่การ์ด = เปิดรายละเอียดกรมธรรม์ ซึ่งจัดเป็นหมวด: <b>หัวการ์ด</b> (ประเภท · เจ้าของงาน · เหลือกี่วัน · ป้ายทะเบียน · เลขกรมธรรม์) → <b>📄 กรมธรรม์</b> → <b>👤 ผู้เอาประกันภัย</b> (กดชื่อเพื่อเปิดลูกค้า) → <b>🚗 รถ</b> (ปุ่ม ดูข้อมูลรถ ›) → <b>🧑‍💼 ผู้คีย์งาน</b> (เจ้าของงาน · งานผ่านสมาชิก · เวลาบันทึก) → <b>📝 ประวัติโน้ต & การติดตาม</b> (5 รายการล่าสุด · ปุ่ม + โน้ต)</li><li><b>ภาษีรถที่ครบต่อ</b> ก็แสดงเป็นการ์ดเช่นกัน: ป้ายทะเบียน · ยี่ห้อ/รุ่น · เจ้าของรถ · วันครบต่อภาษี · ปุ่ม <span class="kbd">📝 โน้ต</span> <span class="kbd">📤 แจ้งเตือน</span> <span class="kbd">ต่อภาษี ›</span> (เปิดฟอร์มบันทึกต่อภาษีของรถคันนั้นทันที)</li><li><b>⏰ กำหนดวันเตือนเองรายรายการ</b> (สำหรับลูกค้าที่ไม่ชอบทำล่วงหน้า): เปิดรายละเอียดกรมธรรม์/รถ → แถบ <b>การแจ้งเตือน</b> → <span class="kbd">กำหนดวันเตือนเอง</span> (หรือกด 📝 โน้ต) → เลือก <b>📅 กำหนดวันเตือนเอง</b> → เลือกวันที่ (มีปุ่มลัด พรุ่งนี้ / 3 / 7 / 14 / 30 วัน) → บันทึก<ul><li>รายการที่กำหนดเอง จะ<b>ไม่ขึ้น</b>ในรายการเตือนปกติ (45 วันก่อนหมดอายุ / 30 วันก่อนครบภาษี) และไม่นับในตัวเลขแจ้งเตือน จนถึงวันที่กำหนด</li><li>ถึงวันแล้ว ขึ้น 🔴 ใน <b>ถึงวันเตือนติดตามลูกค้า</b> (หน้าภาพรวม + แท็บแจ้งเตือน)</li><li>รายการที่ไม่ได้กำหนด = เตือนตามเงื่อนไขปกติเหมือนเดิม</li><li>เปลี่ยนกลับ: กด <span class="kbd">เปลี่ยนวันเตือน</span> → เลือก <b>ตามเงื่อนไขปกติ</b> → บันทึก</li></ul></li><li><b>ป้ายทะเบียนแบบกรอบ</b> (มีจังหวัดบรรทัดล่าง · พื้นขาว ขอบเขียว มีโลโก้ใบข้าวศรีกรุงเป็นลายน้ำจาง) แสดงทุกที่ที่มีทะเบียน: การ์ดต่ออายุ · รายละเอียดกรมธรรม์ · ตารางรถ/กรมธรรม์ · ผลค้นหา</li><li>ปุ่มล่างการ์ด: <span class="kbd">📝 โน้ต</span> <span class="kbd">📤 แจ้งเตือน</span> <span class="kbd">ต่ออายุ ›</span></li><li>ต่ออายุแล้ว / บันทึกผลติดตาม "ไปทำเอง" หรือ "ไม่ต่อแล้ว" รายการจะหายจากแจ้งเตือนเอง</li><li><b>ภาษีรถ</b>: ครบรอบวันจดทะเบียนแล้วแต่ยังไม่ได้กด บันทึกต่อภาษี จะขึ้นสีแดง <b>ภาษี เลยกำหนด (ยังไม่ต่อ)</b> และอยู่ในแท็บแจ้งเตือนต่อ (สูงสุด 90 วัน) · <b>กด + บันทึกต่อภาษี เฉพาะตอนต่อเสร็จจริง</b> (เช่น ลูกค้าตรวจ ตรอ. ผ่านแล้ว) ระบบจะเลื่อนไปปีถัดไปให้เอง · ถ้าลูกค้าไปต่อเอง ใช้ 📝 โน้ต เลือก ไปดำเนินการเอง</li><li><b>ไล่กรอกข้อมูลรถให้ครบ</b>: แท็บ <b>รถ / ภาษี</b> กดปุ่ม <span class="kbd">📝 ข้อมูลรถไม่ครบ</span> จะเห็นรถทุกคันที่ยังขาดข้อมูล พร้อมบอกว่าขาดช่องไหน (จังหวัด ประเภทรถ ลักษณะ ยี่ห้อ รุ่น ปี สี เลขตัวถัง เลขเครื่อง เชื้อเพลิง ซีซี วันจดทะเบียน ผู้ครอบครอง · รถไฟฟ้าไม่นับเลขเครื่องยนต์และซีซี แต่ถ้าเล่มมีพิมพ์ไว้ กรอกได้ และตัวอ่านจะเติมให้) · กด <b>กรอกข้อมูล</b> แล้วใช้ 📷 อ่านจากรูปเล่มทะเบียน ช่วยเติม · บันทึกครบแล้วคันนั้นจะหายจากรายการ</li><li><b>ตัวอ่านเล่มทะเบียน: O กับ 0</b> · ตัวอ่านแยกตามรูปทรง (เลข 0 ผอมกว่า ตัว O กว้างกว่า) · <b>เลขตัวถัง 17 หลัก</b> ไม่มีตัว O, I, Q ตามมาตรฐานสากล ระบบเปลี่ยนเป็นเลข 0, 1 ให้อัตโนมัติ (ทั้งตอนอ่านและตอนพิมพ์เอง) · เลขเครื่องยนต์ ถ้า O อยู่ระหว่างตัวเลข เปลี่ยนเป็น 0 · ชื่อรุ่น เช่น COLORADO คงเป็นตัว O</li><li><b>หน้าภาพรวม</b>: ใต้การ์ดต่างๆ คือ กรมธรรม์/พ.ร.บ. ที่จะหมดอายุ (7/30/45 วัน) · ด้านล่างมีการ์ด <b>ภาษีรถที่ครบกำหนดต่อภายใน 30 วัน</b> และ <b>งวดที่ครบกำหนดภายใน 30 วัน / เลยกำหนด</b> แสดงจำนวน (ขอบแดง = มีเลยกำหนด) กดการ์ดเพื่อเปิดรายการ</li></ul>')+
  S('4.5 โน้ต & การติดตามต่ออายุ (ปรับจาก S-Kurve)','<ul><li><b>ปุ่ม 📝 โน้ต</b> ทุกแถวในรายการใกล้หมดอายุ / ภาษี และในหน้ารายละเอียด (ปุ่ม <b>📝 โน้ต & ติดตาม</b>) · มีปุ่ม <b>📞 โทร</b> / <b>คัดลอกเบอร์</b> / <b>LINE</b> (ใส่ LINE ID ที่ แก้ไขข้อมูลลูกค้า)</li><li>เลือก <b>ผลการติดตาม</b>: ลูกค้าสนใจต่ออายุ · ลูกค้าขอคิดก่อน · ยังไม่ตอบ · ติดต่อไม่ได้ · ไปทำเอง · ไม่ต่อแล้ว · พิมพ์ <b>โน้ต</b> ได้ 200 ตัวอักษร</li><li><b>การแจ้งเตือน</b>: กด <b>ตั้งเตือน</b> แล้วเลือกวัน (ลัด: พรุ่งนี้ / 3 วัน / 7 วัน) · ถึงวันเตือนจะมี <b>🔴</b> ที่รายการ ขึ้นในแท็บ <b>แจ้งเตือน</b> หัวข้อ <b>ถึงวันเตือนติดตามลูกค้า</b> และนับในเลขแดง</li><li><b>ประวัติโน้ต & การติดตาม</b> เก็บทุกครั้งที่บันทึก (ล่าสุด 30 ครั้ง)</li><li><b>ตัวนับ ครบใน 7 / 30 / 45 วัน</b> เหนือรายการกรมธรรม์ใกล้หมดอายุ · กดเพื่อกรองดูเฉพาะช่วงนั้น</li><li>ในหน้า <b>ภาพรวม</b> รายการ <b>กรมธรรม์ที่จะหมดอายุภายใน 45 วัน</b> และ <b>ภาษีรถที่ครบต่อภายใน 30 วัน</b> มีปุ่ม <span class="kbd">ผลติดตาม</span> ทุกแถว ใช้ได้ทั้งประกันรถ พ.ร.บ. ประกันอื่นๆ และภาษี</li><li><b>ยังไม่ตอบ / เพิกเฉย</b>: ยังอยู่ในรายการ เตือนต่อจนถึงวันครบ มีป้ายเหลือง "ยังไม่ตอบ" พร้อมวันที่ติดตาม · ถ้าหมดอายุไปแล้วยังไม่ต่อ ดูได้ที่การ์ด <b>ลูกค้าที่ไม่ต่อ / ยังไม่ตอบ</b></li><li><b>ติดต่อไม่ได้</b>: เหมือน "ยังไม่ตอบ" คือยังอยู่ในรายการและเตือนต่อจนถึงวันครบ แต่มีป้าย "ติดต่อไม่ได้" พร้อมวันที่ · ใส่หมายเหตุได้ เช่น เบอร์ปิด / ไม่รับสาย · ติดต่อได้แล้วกดผลติดตามเปลี่ยนแบบได้เลย</li><li><b>ไปทำเอง / ต่อที่อื่น</b>: เอาออกจากรายการรอบนี้ · ปีหน้าจะกลับมาเตือนอีกครั้งก่อนครบ (มีป้าย "ปีก่อนไปทำเอง") เป็นโอกาสชวนลูกค้ากลับมา</li><li><b>ไม่ต่อแล้ว (ขายรถ / เลิกใช้)</b>: เอาออก และหยุดเตือนรถทะเบียนนี้ทั้งประกัน พ.ร.บ. และภาษี · ประกันที่ไม่มีทะเบียน หยุดเตือนเฉพาะรายการนั้น</li><li>ใส่หมายเหตุสั้นๆ ได้ทุกแบบ เช่น ลูกค้าต่อกับธนาคาร / ขายรถแล้ว</li><li>การ์ด <b>ลูกค้าที่ไม่ต่อ / ยังไม่ตอบ</b> ในหน้าภาพรวม: กดเพื่อดูผลติดตามทั้งหมด · กด <span class="kbd">แก้ผล</span> เพื่อเปลี่ยน หรือ <b>ล้างผลติดตาม</b> ถ้าลูกค้ากลับมาต่อ รายการจะกลับมาเตือนตามปกติ · ในหน้ารายละเอียดกรมธรรม์/รถ ก็มีกล่องผลติดตามและปุ่มแก้ผล</li></ul>')+
  S('4.7 งานแยกตามรหัสที่แจ้ง','<ul><li>หน้า <b>ภาพรวม</b> การ์ด <b>งานแยกตามรหัสที่แจ้ง</b> · กดเพื่อดูทุกงาน จัดกลุ่มตาม <b>รหัสสมาชิกของลูกค้า</b> (ช่องรหัสสมาชิกในข้อมูลลูกค้า)</li><li><b>ลูกค้าที่ยังไม่เป็นสมาชิก</b> (งานแจ้งซื้อเข้ารหัสของฉัน): ช่อง รหัสสมาชิก ของลูกค้า กดปุ่ม <span class="kbd">ยังไม่เป็นสมาชิก (00000000)</span> · ระบบนับเป็นยอดของฉัน · ลูกค้าที่เป็นสมาชิก ใส่รหัสของลูกค้า (งานเข้ารหัสสมาชิก)</li><li><b>งานของฉัน</b> = รหัสของฉัน (ตั้งไว้ AM00015592 แก้ได้ที่ช่อง รหัสของฉัน) · <b>ลูกทีม</b> = งานที่แจ้งให้ลูกทีมโดยใช้รหัสของลูกทีม (แยกกลุ่มตามรหัส) · <b>ลูกค้าทั่วไป</b> = 00000000 · <b>ยังไม่ระบุรหัส</b> = ลูกค้าที่ยังไม่ได้ใส่รหัส (ควรเติม)</li><li>เลือก <b>เดือน</b> ได้ (นับจากวันที่ลูกค้าชำระ ถ้าไม่มี ใช้วันเริ่มคุ้มครอง) · แต่ละกลุ่มบอกจำนวนงานและเบี้ยรวม · กดชื่อกลุ่มเพื่อดูรายการ กดรายการเพื่อเปิดกรมธรรม์</li><li>เห็นครบทุกงานที่บันทึกในแอปเสมอ ไม่ว่าจะเข้ารหัสลูกทีมหรือหลานทีม</li><li><b>ยอดที่ส่งขึ้นถึงฉัน</b> (กล่องบนสุด): รวมงานในรหัสของฉัน + ลูกค้าทั่วไป + สมาชิกในสายงานของฉัน · นับเบี้ยเต็มในเดือนที่เริ่มคุ้มครอง · งานผ่อนนับเมื่อคุ้มครองครบ 45 วัน · ไม่นับค่าปรับ · เป็นยอดประมาณการ ยอดจริงดูจากระบบศรีกรุง</li><li>สมาชิกทุกคนถือว่า <b>อยู่ในสายงานของฉัน</b> เป็นค่าเริ่มต้น · ถ้ารหัสไหนไม่ได้อยู่ในสายงาน กด <span class="kbd">ไม่อยู่ในสาย</span> ยอดของรหัสนั้นจะไม่ถูกนับ (กดอีกครั้งเพื่อกลับ)</li><li><b>กรมธรรม์ที่หมดอายุ</b> ทุกหน้าแยกให้เห็นชัด: <b>แถบเทาจาง + หมดอายุแล้ว · ต่ออายุแล้ว</b> = มีฉบับใหม่แล้ว (เก็บไว้เป็นประวัติ) · <b>แถบชมพู + หมดอายุแล้ว · ยังไม่ต่อ</b> = ควรตามลูกค้า · ในหน้านี้ ฉบับที่ยังคุ้มครองอยู่จะขึ้นก่อน ฉบับหมดอายุอยู่ล่าง</li></ul>')+
  S('4.9 สมาชิกในทีม: เพิ่ม / แก้ไข / ลบ','<ul><li>ไปที่ <b>⚙ ตั้งค่า / คู่มือ</b> แล้วกด <b>👥 สมาชิกในทีม</b> (หรือในหน้า งานแยกตามรหัสที่แจ้ง กดปุ่ม รายชื่อสมาชิกในทีม)</li><li><b>เพิ่มสมาชิก</b>: รอให้ <b>บริษัท ศรีกรุงโบรคเกอร์</b> ออกรหัสก่อน แล้วกด <span class="kbd">+ สมาชิก</span> ใส่รหัส ชื่อ เบอร์ · ค่าเริ่มต้นคือ <b>อยู่ใต้สายงานของฉัน</b> · กันรหัสซ้ำให้อัตโนมัติ</li><li>ถ้ามีลูกค้าชื่อเดียวกันที่ยังเป็น 00000000 ระบบจะถามว่าจะเปลี่ยนรหัสลูกค้าเป็นรหัสสมาชิกใหม่ไหม (เปลี่ยนรหัสสมาชิกทีหลัง ระบบก็ถามให้เปลี่ยนในลูกค้าด้วย)</li><li><b>แก้ไข</b>: กดชื่อสมาชิก แล้วกด <span class="kbd">แก้ไขข้อมูลสมาชิก</span> · สมาชิกที่ไม่ได้ซื้อใช้ ให้ตั้งสถานะ <b>พักไว้</b> แทนการลบ</li><li><b>ลบ</b> (ไม่แนะนำ): ครั้งที่ 1 กด <span class="kbd">ลบสมาชิก</span> = บันทึก ขอลบ · ต้อง <b>ข้ามวัน</b> ก่อน จึงกด <span class="kbd">ลบถาวร</span> ได้ แล้วพิมพ์รหัสสมาชิกยืนยันอีกครั้ง · ยกเลิกการขอลบได้ตลอด · งานและลูกค้าเดิมไม่ถูกลบ</li><li>ตอนกรอกช่องรหัสสมาชิกของลูกค้า จะมีรายการรหัสสมาชิกให้เลือก</li></ul>')+S('4.8 ใส่ LINE ของลูกค้า (เปิดแชทจากแอป)','<p><b>ช่องนี้ไม่บังคับ</b> · ใส่แล้วจะมีปุ่ม <b style="color:#06c755">LINE</b> สีเขียว ในหน้าโน้ต & ติดตาม และหน้ารายละเอียด กดแล้วเปิดแชทลูกค้าใน LINE ได้ทันที</p><p><b>ใส่ได้ 2 แบบ</b> (ที่ แก้ไขข้อมูลลูกค้า → ช่อง LINE ID หรือลิงก์ LINE)</p><ol><li><b>ลิงก์ LINE (แนะนำ ใช้ได้แน่นอน)</b> เช่น <code>https://line.me/ti/p/xxxxx</code> · วางทั้งบรรทัด</li><li><b>รูป QR โค้ด LINE</b> ที่ลูกค้าส่งมา · บันทึกรูปลงเครื่อง → ในฟอร์มแก้ไขลูกค้า กด <span class="kbd">📷 อ่านจากรูป QR</span> → เลือกรูป → ระบบอ่านลิงก์ใส่ช่องให้ → กด บันทึก</li><li><b>LINE ID</b> เช่น <code>somchai123</code> · ใช้ได้เฉพาะลูกค้าที่เปิด <b>อนุญาตให้เพิ่มเพื่อนด้วยไอดี</b> ไว้ (หลายคนไม่ได้เปิด)</li></ol><p><b>ขั้นตอนให้ลูกค้าหาลิงก์ LINE ของตัวเอง</b> (บอกลูกค้าทีละข้อ)</p><ol><li>เปิดแอป <b>LINE</b> → กดแท็บ <b>หน้าหลัก</b> (รูปบ้าน)</li><li>กดไอคอน <b>เพิ่มเพื่อน</b> (รูปคน + ) มุมขวาบน</li><li>กด <b>QR โค้ด</b> → กด <b>QR โค้ดของฉัน</b></li><li>กด <b>คัดลอกลิงก์</b></li><li>วางลิงก์ส่งกลับมาในแชท → เราคัดลอกไปวางในช่อง LINE ของลูกค้าในแอป → กด บันทึก</li></ol><p><b>ทางลัด:</b> ในฟอร์มแก้ไขลูกค้า กด <span class="kbd">📋 คัดลอกข้อความแนะนำส่งลูกค้า</span> ระบบคัดลอกข้อความขั้นตอนข้างบนให้ วางส่งลูกค้าใน LINE ได้เลย</p><p><b>ถ้าลูกค้าเป็นเพื่อนใน LINE อยู่แล้ว</b> เว้นว่างได้ ทักในแอป LINE ตามปกติ · ปุ่ม <b>📞 โทร</b> / <b>คัดลอกเบอร์</b> ใช้ได้เสมอ (บางเครื่องกดโทรจากแอปไม่ได้ ให้คัดลอกเบอร์ไปวางในแอปโทรศัพท์)</p>')+
  S('4.6 ตรวจข้อมูลซ้ำ และวันที่บันทึก','<ul><li><b>ตอนบันทึกกรมธรรม์</b> (ประกันรถ / พ.ร.บ. / ประกันอื่นๆ / ประกันชีวิต) ระบบจะเตือน <b class="bad">⚠ อาจซ้ำกับฉบับที่มีอยู่แล้ว</b> ถ้าพบฉบับที่ <b>ทะเบียนรถ</b> (หรือ <b>ชื่อผู้เอาประกัน</b> ถ้าไม่มีทะเบียน) + <b>ประเภทกรมธรรม์</b> ตรงกัน และช่วงคุ้มครองทับกัน หรือเลขกรมธรรม์ซ้ำกัน · ถ้าเป็นฉบับเดียวกัน ให้กลับไปแก้ไขฉบับเดิมแทน</li><li><b>ข้อมูลที่มีอยู่แล้ว</b>: ถ้าพบคู่ที่อาจซ้ำ หน้า <b>ภาพรวม</b> จะมีการ์ด <b>ข้อมูลอาจซ้ำ</b> (ขอบเหลือง) · กดเพื่อดูเป็นคู่ เทียบเลขที่ ช่วงคุ้มครอง เบี้ย และวันที่บันทึก · ซ้ำจริง: เปิดฉบับที่เกิน (เช่น เลขยังเป็น รอ / 00) แล้วกด <b>ลบ</b> · ไม่ซ้ำ: กด <span class="kbd">ไม่ซ้ำ</span> คู่นั้นจะไม่ขึ้นอีก · ไม่มีคู่ซ้ำ การ์ดจะไม่แสดง</li><li><b>ปุ่มตัวเลขในมือถือ</b>: ในมือถือ ใต้ช่องค้นหามีแถว <b>ปุ่มตัวเลข 1–0 และ ⌫</b> · กดตัวเลขแล้ว แป้นพิมพ์จะไม่เด้งขึ้น · พิมพ์ทะเบียนต่อเนื่องได้ เช่น กด 3 → แตะช่องค้นหาแล้วพิมพ์ กฒ → กด 5 4 7 3 · กด <b>ซ่อน</b> ถ้าไม่ใช้ (กด <b>แสดงปุ่มตัวเลข</b> เพื่อเปิดกลับ)</li><li><b>ตรวจทะเบียนพิมพ์ผิด</b>: ตอนบันทึกรถหรือกรมธรรม์ ถ้าทะเบียนที่พิมพ์ <b>ต่างจากทะเบียนที่มีอยู่แค่ 1 ตัว หรือตัวเลขสลับที่</b> (เช่น 3กฒ 5473 กับ 3กฒ 5743) ระบบจะเตือน ⚠ ให้ตรวจกับเล่มทะเบียนก่อน · ข้อมูลที่มีอยู่แล้ว ดูได้ในการ์ด <b>ข้อมูลอาจซ้ำ</b> หัวข้อ <b>ทะเบียนอาจพิมพ์ผิด</b> · คนละคันจริง กด <span class="kbd">ไม่ผิด</span></li><li><b>วันที่บันทึก</b> 🔒: ระบบบันทึกวันและเวลาให้อัตโนมัติตอนกดยืนยันเพิ่มกรมธรรม์ ผู้ใช้ไม่ต้องกรอก และแก้ไขเองไม่ได้ (กันความคลาดเคลื่อน) · ถ้ามีการแก้ไขภายหลัง ระบบบันทึก <b>แก้ไขล่าสุด</b> ให้เองด้วย · ในรายการกรมธรรม์ทุกแท็บ ใต้ชื่อลูกค้ามีตัวเล็ก <b>บันทึก วัน/เดือน/ปี</b> และในหน้ารายละเอียดมี <b>บันทึกเข้าระบบเมื่อ</b> ใช้ดูว่าฉบับไหนสร้างก่อน/หลัง</li><li><b>ประวัติการบันทึก</b> 🔒: ในหน้ารายละเอียดกรมธรรม์ / รถ / ลูกค้า กด <b>ประวัติการบันทึก</b> เพื่อดูว่าสร้างเมื่อไหร่ แก้ไขอะไรไปบ้าง (ช่องไหน ค่าเดิม → ค่าใหม่) รับชำระงวดไหน บันทึกผลติดตาม/ตามเลขกรมธรรม์เมื่อไหร่ · ระบบบันทึกให้อัตโนมัติ แก้ไขหรือลบไม่ได้ · เก็บล่าสุด 50 รายการต่อกรมธรรม์ · ข้อมูลที่บันทึกก่อนมีระบบนี้ จะเห็นแค่วันที่สร้าง</li><li>หมายเหตุ: กรมธรรม์ที่ต่ออายุแล้ว (มีฉบับปีถัดไปในระบบ) จะไม่ขึ้นในรายการใกล้หมดอายุ เพราะถือว่าต่อเรียบร้อยแล้ว</li></ul>')+
  S('4.3 งานผ่านสมาชิก / ค่าคอมสมาชิก','<p>ใช้เมื่อสมาชิกในสาย (เช่น คุณมิ่ง) ส่งงานเข้ารหัสคุณ แล้วคุณแบ่งค่าคอมให้</p><ol><li>ฟอร์มกรมธรรม์ → กล่อง <b>งานผ่านสมาชิก</b> เลือกชื่อสมาชิก (จากรายชื่อทีม)</li><li>ประกันรถ: เลือก <b>การซ่อม</b> ซ่อมอู่ / ซ่อมห้าง ด้วย (อัตราต่างกัน)</li><li><b>วันที่ลูกค้าชำระ</b> เป็นตัวเลือกตาราง: เช่น เริ่มคุ้มครอง 1/11/69 แต่ลูกค้าชำระ 15/10/69 → ใช้ตารางเดือนตุลาคม</li><li>ระบบดึงอัตรา % จาก<b>ตารางค่าคอมระดับ 6 ของเดือนที่ลูกค้าชำระ</b> ตาม<b>บริษัทประกัน</b> และประเภท (ป1 ซ่อมอู่/ซ่อมห้าง, ป2+/3+, พ.ร.บ. 1.10/1.40A) · แก้เองได้</li><li><b>ช่องทางแจ้งงาน</b>: ขายออนไลน์ต้องแจ้งงานเข้า <b>724</b> (บริษัทลูกของศรีกรุงโบรคเกอร์) เลือก "724" แล้วระบบใช้อัตรากลุ่ม 724AGL สำหรับ พ.ร.บ. และ ป2+/3+/3</li><li>ค่าคอม = เบี้ย × 0.9309 × อัตรา% · บันทึกไว้กับกรมธรรม์ ตารางเดือนหน้าเปลี่ยน ยอดเดิมไม่เปลี่ยน</li><li>สรุปรายเดือนแยกรายสมาชิก: ตั้งค่า → แผนการตลาด → <b>ค่าคอมที่ต้องจ่ายสมาชิก</b></li></ol><p class="mu">ยอดขายยังนับเป็นของคุณ · ตารางค่าคอมเปลี่ยนทุกเดือน ส่ง PDF ให้ Claude อัปเดต · ถ้ายังไม่มีตารางเดือนนั้น ระบบใช้เดือนล่าสุดและแจ้งให้ทราบ</p>')+
  S('5. ต่ออายุกรมธรรม์','<p><b>มีในแจ้งเตือน</b> (หมดอายุภายใน 45 วัน): กด <span class="kbd">ต่ออายุ</span> ในแถวนั้น</p><p><b>ไม่มีในแจ้งเตือน</b>: ค้นหาทะเบียน (ข้อ 2) → เปิดฉบับล่าสุด → <span class="kbd">ต่ออายุ (สร้างฉบับใหม่)</span></p><ol><li>ฟอร์มกรอกลูกค้า ทะเบียน บริษัท ชั้น ส่วนลด และวันเริ่ม (= วันหมดอายุเดิม) ให้แล้ว</li><li>ใส่ <b>เลขกรมธรรม์ใหม่</b> และ <b>เบี้ย</b> · เลือกเงินสด/ผ่อน</li><li>บันทึก → ตรวจหน้ายืนยัน → ยืนยัน · ฉบับเดิมจะหายจากแจ้งเตือนเอง</li></ol>')+
  S('6. เพิ่มกรมธรรม์รถ / พ.ร.บ. ใหม่','<ol><li>แท็บ <b>กรมธรรม์รถ</b> → <span class="kbd">+ กรมธรรม์</span> (หรือเปิดหน้าลูกค้า → <span class="kbd">+ กรมธรรม์รถ</span>)</li><li>ลูกค้าเดิม: เลือกจากรายชื่อ · ลูกค้าใหม่: เลือก <b>+ ลูกค้าใหม่</b> แล้วกรอกในฟอร์ม</li><li>ประกันรถ: ส่วนลดสมาชิกเริ่ม 12% (5–18%) · พ.ร.บ. รถยนต์/กระบะ: ส่วนลดตามตารางค่าคอม (ปุ่มลัด 5/20/25%) · พ.ร.บ. <b>บริษัทกลางคุ้มครองผู้ประสบภัยจากรถ (พ.ร.บ. รถจักรยานยนต์ซื้อเดี่ยว): ไม่มีส่วนลด</b> เก็บเต็มเบี้ย (เลือกบริษัทนี้แล้วช่องส่วนลดจะซ่อนให้เอง) · พ.ร.บ. รถจักรยานยนต์ที่ซื้อควบกับประกันภาคสมัครใจ (บริษัทอื่น): ส่วนลดตามตารางปกติ · พ.ร.บ. ชำระเงินสดเท่านั้น · <b>เบี้ย พ.ร.บ. ตามพิกัด:</b> ใต้ช่องเบี้ยระบบคำนวณให้จากประเภทรถ (รย.) / ซีซี และวันคุ้มครอง (เต็มปี: รย.1 645.21 · รย.3 967.28 · รย.12 ≤75cc 161.57 · ≤125cc 323.14 · ≤150cc 430.14 · เกิน 150cc 645.21) ถ้าคุ้มครองไม่เต็มปี (ถึงวันครบภาษี) คิดเฉลี่ยรายวัน: เบี้ยสุทธิ × วัน ÷ 365 + อากร + VAT 7% · กดปุ่ม "ใช้ …" เพื่อเติมเบี้ย</li><li>ผ่อน: ไม่เกิน 10 งวด งวดละไม่ต่ำกว่า 500 บาท · ค่างวดคำนวณตามสูตรศรีกรุงให้ (กล่องสรุปแสดงวิธีคิด)</li><li>บันทึก → ตรวจหน้ายืนยัน → ยืนยัน</li></ol>')+
  S('7. ประกันอื่นๆ / ประกันชีวิต','<ol><li>แท็บ <b>ประกันอื่นๆ</b> หรือ <b>ประกันชีวิต</b> → ปุ่มเขียว + (หรือจากหน้าลูกค้า)</li><li>เลือกประเภท บริษัท วันคุ้มครอง เบี้ย · ผ่อนได้ (เบี้ย ÷ งวด ไม่ใช้สูตรส่วนลด)</li></ol>')+
  S('7.1 เมนูรถ / ภาษี','<p>แท็บ <b>รถ / ภาษี</b> รวมรถทุกคัน 1 คัน = 1 รายการ · จับคู่ด้วย <b>ทะเบียน</b> (ไม่สนเว้นวรรค ขีด และจังหวัด) · จังหวัดใส่หรือไม่ใส่ก็ได้</p><ol><li><b>ครั้งแรก</b>: ถ้ามีกล่อง "รายการรถยังไม่ครบ / มีรถซ้ำ" กด <span class="kbd">ตรวจและจัดรายการรถ</span> ระบบจะสร้างรถที่ขาด เติมทะเบียนให้รถเดิมที่ยังไม่มีทะเบียน และรวมรถซ้ำ · ตรวจคันที่มีป้ายเหลือง (ทะเบียนเขียนต่างกัน / ลูกค้าต่างกัน) แล้วยืนยัน</li><li>แต่ละคันแสดงสถานะ <span class="tg ok">ประกัน</span> <span class="tg ok">พ.ร.บ.</span> <span class="tg ok">ภาษี</span> · เขียว = ยังคุ้มครอง, เหลือง = ใกล้หมด, แดง = หมดแล้ว, เทา = ยังไม่ได้ทำกับเรา</li><li>ปุ่มกรองด้านบน: <b>ยังไม่มี พ.ร.บ. กับเรา</b> / <b>ยังไม่มีภาษีกับเรา</b> ใช้หาโอกาสขายเพิ่ม · <b>ประกัน/พ.ร.บ. หมดแล้ว</b></li><li>เปิดรถ: ปุ่ม <span class="kbd">ต่ออายุประกันรถ</span> <span class="kbd">ต่ออายุพ.ร.บ.</span> (หรือ + ถ้ายังไม่มี) <span class="kbd">+ บันทึกต่อภาษี</span> · ประวัติทุกปีของรถคันนั้นอยู่ด้านล่าง</li><li><span class="kbd">แก้ไขข้อมูลรถ</span>: <b>ประเภทรถ (รย.)</b> ตามระบบขนส่ง (รย.1 รถยนต์นั่งไม่เกิน 7 คน · รย.3 รถยนต์บรรทุก/กระบะ · รย.12 รถจักรยานยนต์ ฯลฯ) ยี่ห้อ รุ่น ปี สี เลขตัวถัง เลขเครื่อง ซีซี <b>วันจดทะเบียน</b> (ใช้เตือนภาษี) และ <b>ผู้ครอบครอง</b> (เก็บเฉพาะชื่อ ไม่เก็บเลขบัตรประชาชน / เลขนิติบุคคล / วันเกิด)</li><li>เพิ่มกรมธรรม์ใหม่ที่มีทะเบียน ระบบเพิ่มรถเข้ารายการให้อัตโนมัติ</li></ol>')+
  S('7.2 อ่านเล่มทะเบียนอัตโนมัติ (📷)','<ol><li>เปิดฟอร์ม <span class="kbd">+ รถ</span> หรือ <span class="kbd">แก้ไขข้อมูลรถ</span> → กด <span class="kbd">📷 อ่านจากรูป / PDF เล่มทะเบียน</span> (หน้านี้อ่าน<b>เฉพาะหน้ารายการจดทะเบียน</b>) · เลือกรูป (JPG/PNG) หรือไฟล์ PDF ได้ (PDF อ่านได้สูงสุด 3 หน้าแรก ถ้า PDF ตั้งรหัสผ่านไว้ให้แคปหน้าจอเป็นรูปแทน)</li><li><b>ถ้าเลือกไฟล์ พ.ร.บ./กรมธรรม์ ในหน้านี้</b> ระบบจะแจ้งว่าไม่ใช่เล่มทะเบียน และไม่เติมข้อมูล · ให้ไปอ่านที่ฟอร์มกรมธรรม์แทน (ข้อ 7.3)</li><li>ถ้ารถมีข้อมูลอยู่แล้ว ระบบ<b>ไม่เขียนทับ</b>ค่าเดิม ถ้าเอกสารอ่านได้ไม่ตรง จะขึ้นรายการ "ค่าที่บันทึกไว้ต่างจากเอกสาร" ให้ตรวจ</li><li><b>รถไฟฟ้า:</b> ระบบอ่านช่อง "เชื้อเพลิง" ด้วย ถ้าเป็น <b>ไฟฟ้า</b> ช่องเลขเครื่องยนต์และซีซีปล่อยว่างได้ ไม่ขึ้นเครื่องหมายให้ตรวจ และเลือกรหัส พ.ร.บ. รถไฟฟ้า (1.10E / 1.30E) ให้</li><li>ระบบส่งภาพขยายส่วนบนของเล่ม (ช่องทะเบียน เลขตัวถัง เลขเครื่อง) ไปพร้อมกันอัตโนมัติ ให้อ่านตัวเล็กได้ชัดขึ้น · ถ้าทะเบียนยังขึ้น ⚠ ให้เทียบกับรูปจริง</li><li>ครั้งแรกหลังเปิดแอป Claude จะมีหน้าต่างขออนุญาตส่งรูป (เป็นระบบความปลอดภัยของ Claude ปิดไม่ได้) กด <b>ดำเนินการต่อ</b> ครั้งเดียว ครั้งถัดไปไม่ถามซ้ำจนกว่าจะเปิดแอปใหม่</li><li>เลือกรูปหน้า <b>รายการจดทะเบียน</b> ครั้งแรกระบบถามอนุญาตให้ใช้ Claude</li><li>รอ 10–60 วินาที ระบบเติมฟอร์มให้ · ช่องพื้นเขียว = อ่านจากรูป</li><li><b class="bad">ช่องกรอบแดง ⚠</b> = อ่านไม่ชัด / ไม่แน่ใจ ตรวจกับรูปจริง แก้ให้ถูก หรือกด <span class="kbd">ถูกแล้ว</span></li><li>เลือกลูกค้าให้อัตโนมัติถ้าชื่อผู้ครอบครองตรงกับลูกค้าในระบบ · ถ้าทะเบียนมีอยู่แล้ว จะมีปุ่ม <span class="kbd">เปิดคันเดิม</span></li><li>กด <span class="kbd">บันทึก</span> · ถ้ายังมีช่องที่ไม่ได้ตรวจ รถคันนั้นจะมีป้าย <span class="tg bad">⚠ รอตรวจ</span> ให้ผู้ตรวจสอบมาดูอีกครั้ง</li></ol><p class="mu">เก็บเฉพาะข้อมูลรถและชื่อ-นามสกุลผู้ครอบครอง ไม่มีคำนำหน้า (ถ้าเล่มไม่มีผู้ครอบครอง และผู้ถือกรรมสิทธิ์เป็นบุคคล เช่นผ่อนหมดแล้ว ใช้ชื่อผู้ถือกรรมสิทธิ์แทน · ถ้าผู้ถือกรรมสิทธิ์เป็นบริษัทลิสซิ่ง/ไฟแนนซ์ ไม่เก็บ) · ไม่เก็บ เลขบัตร เลขนิติบุคคล วันเกิด ที่อยู่ · การอ่านแต่ละครั้งใช้โควตาการใช้งาน Claude ของคุณ · ใช้ได้เมื่อเปิดแอปผ่าน Claude</p>')+
  S('7.3 อ่านตารางกรมธรรม์ / พ.ร.บ. อัตโนมัติ (📷)','<ol><li>เปิดกรมธรรม์ที่ต้องการ แล้วกด <span class="kbd">แก้ไขกรมธรรม์</span> (เช่น พ.ร.บ. ที่ยังเป็นเลขชั่วคราว "00" พอ พ.ร.บ. ออกแล้ว) · หรือเปิดฟอร์มใหม่ <span class="kbd">+ พ.ร.บ.</span> / <span class="kbd">ต่ออายุ</span></li><li>กด <span class="kbd">📷 อ่านจากรูป / PDF ตารางกรมธรรม์ / พ.ร.บ.</span> ที่ด้านบนของฟอร์ม · เลือกรูปหรือ PDF</li><li>รอ 10–60 วินาที ระบบเติม <b>บริษัท เลขกรมธรรม์ วันเริ่ม–สิ้นสุด เบี้ย</b> (ประกันรถ: ชั้นประกัน การซ่อม · พ.ร.บ.: รหัสรถ) ลงในฟอร์มนี้เลย · ช่องพื้นเขียว = อ่านจากเอกสาร · <b class="bad">กรอบแดง</b> = ไม่แน่ใจ ตรวจกับเอกสาร · ใต้ปุ่มมีกล่องสรุปสิ่งที่อ่านได้</li><li>ระบบ<b>ไม่แตะวิธีชำระและงวดผ่อน</b> · กรมธรรม์ที่มีงวดผ่อนอยู่แล้ว งวดเดิมยังอยู่ครบ ไม่สร้างใหม่ · พ.ร.บ. จ่ายสดครั้งเดียวเสมอ</li><li>ถ้าเอกสารเป็นคนละชนิดกับฟอร์ม (เช่น อ่าน พ.ร.บ. ในฟอร์มประกันรถ) ระบบจะเตือนและไม่เติมให้ · ให้ปิด แล้วเปิดฉบับที่ถูกชนิด</li><li>ถ้าเลขกรมธรรม์มีในระบบแล้ว หรือชื่อผู้เอาประกันไม่ตรงกับลูกค้าที่เลือก ระบบจะเตือนให้ตรวจ</li><li>ตรวจครบแล้วกด <span class="kbd">บันทึก</span></li></ol>')+
  S('7.4 ช่องทางแจ้งงาน','<ul><li><b>กรมธรรม์รถ / ประกันอื่นๆ:</b> ศรีกรุงโบรคเกอร์ · 724 (ขายออนไลน์) · อื่นๆ (พิมพ์เอง)</li><li><b>ประกันชีวิต:</b> ศรีกรุงประกันชีวิต · 724 ประกันชีวิต · อื่นๆ (พิมพ์เอง) เช่น เป็นตัวแทนประกันชีวิตบริษัทอื่น</li><li>ช่องทางที่พิมพ์เองจะถูกจำไว้ใน <b>ช่องทางของฉัน</b> เลือกใช้ซ้ำได้ทุกฟอร์ม · เพิ่ม/ลบได้ที่ ตั้งค่า / คู่มือ → ช่องทางแจ้งงาน</li><li><b>ค้นหาตามช่องทาง:</b> ในแท็บกรมธรรม์รถ / ประกันอื่นๆ / ประกันชีวิต กดปุ่มช่องทางใต้ช่องค้นหาเพื่อกรอง หรือพิมพ์ชื่อช่องทางในช่องค้นหา · การ์ดช่องทางในหน้าตั้งค่าแสดงจำนวนงานของแต่ละช่องทาง กดแล้วไปที่รายการนั้นทันที</li><li>ตารางค่าคอมใช้ช่องทาง 724 ในการเลือกอัตรา 724 ให้อัตโนมัติ</li><li><b>ปุ่มกรองช่องทาง</b>อยู่ใต้ช่องค้นหาของแท็บ ตามด้วย<b>แถบเลือกหน้า</b>: แสดงหน้าละ 20 รายการ (เปลี่ยนเป็น 50 / 100 ได้ที่ "ต่อหน้า" ระบบจำไว้) · กดเลขหน้า ‹ › หรือเลือก "ไปหน้า" · มีแถบเลขหน้าซ้ำท้ายตาราง</li><li><b>ปุ่มย้อนกลับ (←) ลอยมุมซ้ายล่าง</b>: ปิดหน้าต่างที่เปิดอยู่ทีละชั้น (หน้าต่างยืนยัน → ฟอร์ม → รายละเอียด) แล้วย้อนแท็บ / หน้า / ตัวกรองที่ดูก่อนหน้าทีละขั้น จนกลับถึงหน้าภาพรวม</li><li><b>ช่องทางอื่น</b> (อื่นๆ / ช่องทางของฉัน) <b>ไม่นับรวมยอดขายศรีกรุง</b> และ<b>ไม่ใช้สูตรค่าคอมศรีกรุง</b> ทั้งรถ พ.ร.บ. ประกันอื่นๆ ประกันชีวิต: ฟอร์มซ่อนส่วนลดสมาชิก % ตารางค่าคอม และงานผ่านสมาชิก แล้วให้กรอกแทน <b>ส่วนลดให้ลูกค้า (บาท)</b> (เฉพาะรถ/พ.ร.บ.) และ <b>ค่าคอมที่ได้รับ (บาท)</b> เอง · ยอดเรียกเก็บ = เบี้ย − ส่วนลด · ผ่อน = ยอดนั้น ÷ งวด (ไม่มีกติกาหัก 2% ขั้นต่ำ 500 บาท หรือไม่เกิน 10 งวด)</li><li>ยอดของช่องทางอื่นแสดงแยกที่ แผนการตลาด → <b>ยอดขายช่องทางอื่น</b> (รายเดือน × ช่องทาง พร้อมเบี้ยรวมและค่าคอมที่กรอก) · ไม่นำไปเช็กระดับ และไม่อยู่ในค่าคอมที่ต้องจ่ายสมาชิก · ใบเตือนต่ออายุของงานช่องทางอื่นเก็บเต็มเบี้ย ไม่มีส่วนลดสมาชิก</li></ul>')+
  S('7.5 ข้อมูลอ้างอิง: รหัสบริษัทประกัน และพิกัดเบี้ย พ.ร.บ.','<p><b>📊 ตารางค่าคอม</b> (ตั้งค่า / คู่มือ → ตารางค่าคอม): ตารางเต็มทุกบริษัท แบ่งกลุ่มด้วยสี · เลือกระดับได้เฉพาะระดับของตัวเองและระดับที่ต่ำกว่า (ระดับ 5 +3% · ระดับ 4 +4% · ระดับ 3 +5% ยกเว้นช่องที่มี *) · ปุ่ม "ไปที่" เลื่อนไปกลุ่มที่ต้องการ · ในฟอร์มกรมธรรม์ ถ้าเลือกผ่อนกับบริษัทที่ไม่รับผ่อน Lucky ระบบจะเตือน</p><p><b>รหัสบริษัท</b> พิมพ์อยู่มุมบนซ้ายของตารางกรมธรรม์และ พ.ร.บ. ("รหัสบริษัท / Co. Code") ระบบใช้รหัสนี้บอกชื่อบริษัทแทนการเดาจากโลโก้ · บางบริษัทพิมพ์รหัสสั้นของตัวเอง เช่น กรุงเทพประกันภัยพิมพ์ "002" บางบริษัทใช้อักษรย่อภาษาอังกฤษ · <b>ระบบเรียนรู้เอง:</b> ถ้าอ่านเจอรหัสที่ยังไม่รู้จัก ให้เลือกบริษัทให้ถูกในฟอร์มกรมธรรม์แล้วบันทึก ครั้งต่อไประบบจะเลือกบริษัทนั้นให้อัตโนมัติ</p>'+(function(){var L=(D.profile&&D.profile.coLearn)||{},k=Object.keys(L);return k.length?'<div class="sc"><table><tr><th>รหัสที่ระบบจำไว้</th><th>บริษัท</th></tr>'+k.sort().map(function(x){return '<tr><td>'+esc(x)+'</td><td>'+esc(L[x])+'</td></tr>'}).join("")+'</table></div>':''})()+'<p class="mu" style="font-size:12.5px">รหัสที่ใช้บนเอกสารจริง (ใส่ไว้แล้ว): VIB วิริยะ · 002 กรุงเทพ · MTI เมืองไทย · DHP ทิพย · TMSTH คุ้มภัยโตเกียวมารีน · TVI ไทยวิวัฒน์ · MSI เอ็มเอสไอจี · AAGI อลิอันซ์ อยุธยา · ABI ไอโออิ กรุงเทพ · 2084 ชับบ์สามัคคี · DVS เทเวศ · 2029 เออร์โก · TNI ธนชาต · TPB ไทยไพบูลย์ · TSI / TSK ไทยเศรษฐกิจ และรหัส คปภ. 4 หลักด้านล่าง</p><details><summary style="cursor:pointer;color:var(--ac)">ตารางรหัสบริษัทประกันวินาศภัย (รหัส คปภ.)</summary><div class="sc"><table><tr><th>รหัส</th><th>บริษัท</th></tr>'+COFULL.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+esc(x[1])+'</td></tr>'}).join("")+'</table></div><p class="mu" style="font-size:12.5px">ที่มา: ดัชนีตารางรหัสอ้างอิงมาตรฐานของบริษัทประกันภัย (สำนักงาน คปภ.)</p></details>'+
  '<p style="margin-top:10px"><b>พิกัดเบี้ย พ.ร.บ.</b> เบี้ยสุทธิต่อปี · เบี้ยรวม = สุทธิ + อากร (0.4% ปัดขึ้น) + VAT 7% · ถ้าคุ้มครองไม่เต็มปี คิดเฉลี่ยรายวัน (สุทธิ × วัน ÷ 365) · ในฟอร์ม พ.ร.บ. เลือก "รหัสรถ พ.ร.บ." แล้วระบบคำนวณให้</p><details><summary style="cursor:pointer;color:var(--ac)">ตารางพิกัดเบี้ย พ.ร.บ. ทุกประเภทรถ</summary><div class="sc"><table><tr><th>รหัส</th><th>ประเภทรถ</th><th>สุทธิ</th><th>รวม/ปี</th></tr>'+CMIT.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+esc(x[1])+'</td><td>'+m2(x[2])+'</td><td><b>'+m2(cmiPrem(x[2]).tot)+'</b></td></tr>'}).join("")+'</table></div><p class="mu" style="font-size:12.5px">รหัส 1.xx = ใช้ส่วนบุคคล · 3.xx = รับจ้าง/ให้เช่า · ตัวอักษรท้ายรหัส (A B C D) แบ่งตามที่นั่ง/ตัน/ซีซี ตามที่แต่ละบริษัทพิมพ์อาจต่างกันเล็กน้อย · ตรวจกับใบเสนอราคาของบริษัทก่อนแจ้งลูกค้าเสมอ</p></details>')+
  S('8. ต่อภาษีรถ','<ol><li>แท็บ <b>รถ / ภาษี</b> → เปิดรถ → <span class="kbd">+ บันทึกต่อภาษี</span> (หรือ + กรมธรรม์ เลือกชนิด "ภาษีรถ")</li><li>ใส่ค่าภาษี · ค่าจัดส่งป้ายภาษีตั้งไว้ <b>32 บาท</b> · ค่าดำเนินการ <b>150 บาท</b> (เอาติ๊ก "เก็บค่าดำเนินการ" ออกได้ถ้าไม่เก็บ)</li><li>ลูกค้าสมาชิก: ติ๊ก "ลูกค้าเป็นสมาชิก" ค่าดำเนินการเป็น 0 (ติ๊กให้อัตโนมัติถ้ามีรหัสสมาชิก) · ฟอร์มมีข้อความแดง "ฟรีค่าดำเนินการต่อภาษี สำหรับสมาชิก" ไว้ชวนลูกค้าสมัครสมาชิก</li><li>เตือนล่วงหน้า 30 วัน และด่วนเมื่อเหลือ 15 วัน ตามวันจดทะเบียน</li></ol>')+
  S('9. ลูกค้า: แก้ไข / ลบ / รวมชื่อซ้ำ','<ul><li><b>รวมลูกค้าชื่อซ้ำ</b>: หน้า <b>ภาพรวม</b> การ์ด <b>ข้อมูลอาจซ้ำ</b> จะบอกจำนวนลูกค้าชื่อซ้ำด้วย กดเข้าไปแล้วกด <span class="kbd">ตรวจและรวมลูกค้า</span> ได้เลย · หรือที่แท็บ <b>ลูกค้า</b> ถ้ามีกล่อง "พบลูกค้าชื่อซ้ำ" กด <span class="kbd">ตรวจและรวมลูกค้า</span> ติ๊กเฉพาะชื่อที่เป็นคนเดียวกัน (ชื่อเหมือนแต่คนละคน เอาติ๊กออก) → กรมธรรม์ งวด รถ ย้ายไปรวมที่คนเดียว</li><li>เปิดลูกค้า → <span class="kbd">แก้ไขข้อมูลลูกค้า</span> · เบอร์โทรจัดรูปแบบ 000-000-0000 ให้เอง</li><li><b class="bad">ลบลูกค้า = ลบทุกอย่างของคนนั้น</b> (กรมธรรม์ งวด รถ) อ่านรายการในหน้ายืนยันก่อนกด และควรส่งออกไฟล์สำรองก่อน</li></ul>')+
  S('9.1 พิมพ์รายงาน งานที่แจ้ง / ยอดขาย','<ol><li>หน้า <b>ภาพรวม</b> กดการ์ด <b>🖨 พิมพ์รายงาน</b></li><li>เลือก <b>เดือน</b> (หรือ ทั้งปี) และ <b>ปี (พ.ศ.)</b> · ปุ่มลัด <b>เดือนหน้า ของปีที่แล้ว</b> = ไว้ตามงานต่ออายุ (เช่น วันนี้ พ.ย. กดแล้วได้ ธ.ค. ปีที่แล้ว)</li><li>เลือก <b>งานของใคร</b>: ของฉัน + ลูกทีมในสายงาน · เฉพาะของฉัน · เฉพาะลูกทีม · หรือ ลูกทีมรายคน</li><li>ค่าเริ่มต้นแสดงเฉพาะช่องทางที่นับยอด (ศรีกรุงโบรคเกอร์ / 724 / ศรีกรุงประกันชีวิต) · ติ๊ก <b>รวมงานช่องทางอื่น</b> ถ้าต้องการเห็นทั้งหมด</li><li>ดูตัวอย่างด้านล่าง แล้วกด <span class="kbd">🖨 บันทึกไฟล์รายงาน</span> · กดยืนยันบันทึก · ไฟล์ไปอยู่ในโฟลเดอร์ ดาวน์โหลด (กด Ctrl+J ดูได้) · เปิดไฟล์แล้วกดปุ่ม <b>🖨 พิมพ์รายงานนี้</b> ด้านบน (กระดาษ A4 แนวนอน) หรือเลือก บันทึกเป็น PDF เพื่อส่งต่อทาง LINE</li></ol><p class="mu">รายงานแยกกลุ่มตามรหัสที่แจ้ง (งานของฉัน แล้วลูกทีมทีละคน) พร้อมยอดรวม · เรียงตามวันเริ่มคุ้มครอง · ช่อง <b>ต่ออายุ</b> บอก ต่อแล้ว / ยังไม่ต่อ · ช่อง ✓ ว่างไว้ให้ติ๊กด้วยปากกาตอนไล่ตามงาน · ไม่รวมภาษีรถ · ในหน้าตัวอย่าง <b>กดเลขกรมธรรม์</b> เพื่อเปิดดูกรมธรรม์ (กด ← เพื่อกลับมาที่รายงาน) · ถ้ามีไฟล์แนบ กดปุ่ม <b>📄 ไฟล์</b> เปิดดูได้ทันที · บันทึกไฟล์กรมธรรม์ได้จากปุ่ม บันทึก ในหน้ากรมธรรม์ · <b>แนบไฟล์</b>: ใช้ 📷 อ่านจากรูป / PDF ในฟอร์มกรมธรรม์ แล้วกดบันทึก ระบบแนบไฟล์ที่อ่านให้อัตโนมัติ · ฉบับเก่า แนบเองได้ที่หน้ากรมธรรม์ เลื่อนลงไปหัวข้อ <b>ไฟล์กรมธรรม์ / รูป</b> → <b>+ เพิ่มไฟล์</b></p>')+
  S('10. แผนการตลาด / โปรไฟล์ / บัตรนายหน้า','<p>อยู่ในเมนู <b>ตั้งค่า / คู่มือ</b> → ปุ่ม <span class="kbd">แผนการตลาด / โปรไฟล์ / บัตรนายหน้า</span> (หรือแตะป้ายระดับใต้ชื่อแอป) · <b>ทีมงาน</b> อยู่ในเมนูเดียวกัน</p><ul><li>ตั้งค่า → แผนการตลาด → <span class="kbd">แก้ไขโปรไฟล์</span>: ชื่อ รหัสสมาชิก <b>เบอร์มือถือ</b> (แสดงในรูปแจ้งชำระ) ระดับ และ <b>บัตรนายหน้า 2 ใบ</b> (เลขที่ + วันหมดอายุ) · เตือนล่วงหน้า 3 เดือน เดือนละครั้ง ต่อได้ก่อน 2 เดือน</li><li><b>ยอดขายรายเดือน</b>: นับเฉพาะช่องทางศรีกรุงโบรคเกอร์ / 724 / ศรีกรุงประกันชีวิต / 724 ประกันชีวิต (ช่องทางอื่นแยกไปที่ "ยอดขายช่องทางอื่น") · นับเบี้ยเต็มตามเดือนเริ่มคุ้มครอง · งานผ่อนนับได้เมื่อคุ้มครองครบ 45 วัน · แตะเดือนเพื่อดูรายการ</li><li>ปุ่ม <span class="kbd">นำยอด 3 เดือนล่าสุดไปเช็กระดับ</span> แล้วกด บันทึกยอด</li></ul><p><b>เช็กยอดเพื่อปรับระดับ</b>: หน้าภาพรวมมีการ์ด 📈 แสดงยอดเฉลี่ย 3 เดือนและความคืบหน้าสู่ขั้นถัดไป กดการ์ดเพื่อไปหน้ารายละเอียด · ยอดแต่ละเดือน = <b>ยอดของฉัน</b> + <b>ยอดลูกทีม (ในแอป)</b> (งานที่แจ้งเข้ารหัสสมาชิกใต้สายงาน) + <b>ยอดลูกทีมเพิ่ม (นอกแอป)</b> ที่ใส่เอง (ซื้อใช้/ขายเองของลูกทีม) · ดึงจากแอปอัตโนมัติ 3 ช่องทาง เฉพาะยอดที่นับได้แล้ว (ผ่อนครบ 45 วัน) · สมาชิกที่ตั้งเป็น นอกสายงาน ไม่นับ · เลือกช่วง <b>รวมเดือนนี้</b> หรือ <b>3 เดือนที่จบแล้ว</b> (ใช้ช่วงนี้เช็กก่อนแจ้งปรับระดับกับบริษัท) · ใส่ยอดลูกทีมเพิ่มแล้วกด บันทึกยอด ระบบจำไว้ตามเดือน</p><p><b>ความเข้าใจเรื่องยอดลูกทีม (บันทึกไว้กันลืม)</b></p><ul><li><b>ยอดลูกทีม (ในแอป)</b> = งานที่เราแจ้งเข้ารหัสสมาชิก ส่วนใหญ่คือ <b>ยอดซื้อใช้</b> ของลูกทีม</li><li><b>ยอดขายของลูกทีม</b> ที่ลูกทีมทำเอง (ไม่ได้บันทึกในแอปเรา) ใส่ในช่อง <b>+ ยอดลูกทีมเพิ่ม (นอกแอป)</b> ของเดือนนั้น แล้วกด บันทึกยอด (วิธีที่ใช้ตอนนี้)</li><li><b>อนาคต</b> (ตอนเปิดเว็บให้สมาชิกคนอื่นสมัครใช้): ลูกทีมที่ใช้เว็บนี้ด้วย กดยินยอมส่ง <b>ยอดสรุปรายเดือน</b> ขึ้นให้หัวหน้าทีมอัตโนมัติ (ส่งเฉพาะยอดรวม ไม่ส่งข้อมูลลูกค้า ลูกทีมยกเลิกได้) · ระหว่างนี้แต่ละบัญชีแยกข้อมูลกัน หัวหน้ามองไม่เห็นยอดลูกทีม จึงต้องใส่เอง</li></ul><p><b>รายได้รายเดือน (ค่าคอม / ค่าสายงาน)</b>: หน้าภาพรวม กดการ์ด 💰 หรือที่ แผนการตลาด หัวข้อ รายได้รายเดือน · ใส่ยอด <b>ค่าคอม</b> และ <b>ค่าสายงาน</b> ที่บริษัทแจ้ง/โอนในแต่ละเดือน (หมายเหตุใส่ได้) แล้วกด <b>บันทึกรายได้</b> · ตารางแสดง 12 เดือนเสมอ (ขึ้นเดือนใหม่ เดือนเก่าสุดจะเลื่อนออก แต่ข้อมูลไม่หาย) · เลือกช่วง 12 เดือนย้อนหลังได้ถึง 10 ปีจาก Dropdown · กด <b>🖨 บันทึกไฟล์ไว้พิมพ์</b> แล้วเปิดไฟล์ในโฟลเดอร์ ดาวน์โหลด กดปุ่มพิมพ์ในไฟล์ ได้รายงาน 12 เดือนในหน้าเดียว · ตอนนี้ยังไม่คำนวณอัตโนมัติ เพราะยังไม่ทราบสูตรค่าสายงานและค่าคอม Non-Motor / ประกันชีวิตของบริษัท</p>')+
  S('11. สำรองข้อมูล','<ul><li>ข้อมูลซิงก์ขึ้นระบบกลางเอง ใช้ได้ทั้งมือถือและคอม (ล็อกอิน Claude บัญชีเดียวกัน)</li><li>แนะนำกด <span class="kbd">ส่งออกไฟล์สำรอง</span> (ในหน้านี้) <b>เดือนละครั้ง</b> และก่อนลบข้อมูลจำนวนมาก</li><li><b class="bad">นำเข้า</b> จะแทนที่ข้อมูลทั้งหมดด้วยไฟล์ ใช้เฉพาะตอนกู้ข้อมูล</li></ul>')+
  S('12. ปัญหาที่พบบ่อย','<ul><li><b>เปิดฟอร์มจากหน้าลูกค้า/กรมธรรม์แล้วอยากกลับ</b>: กด <span class="kbd">← ย้อนกลับ</span> มุมบนของฟอร์ม (ข้อมูลที่ยังไม่บันทึกจะไม่ถูกเก็บ)</li><li><b>ข้อมูลไม่อัปเดต / ไม่เห็นของที่เพิ่งแก้จากอีกเครื่อง</b>: รีเฟรชหน้า</li><li><b>มีกล่อง "แทนที่" เด้งในแชต Claude</b>: คือการอัปเดตแอป กดแทนที่ได้ ข้อมูลไม่หาย</li><li><b>หน้าต่างแดง "บันทึกไม่สำเร็จ"</b>: แคปหน้าจอส่งให้ Claude</li><li>เลขเวอร์ชันอยู่มุมบนขวา (เช่น v93) ใช้แจ้งเวลาถาม Claude</li></ul>')+

function compactForm(){
  var root=$("#sh");if(!root)return;root.classList.add("form");
  var isField=function(n){return n&&n.nodeType===1&&/^(INPUT|SELECT|DATALIST|TEXTAREA)$/.test(n.tagName)};
  var wrap=function(box){
    var kids=Array.prototype.slice.call(box.children),i=0;
    while(i<kids.length){
      var k=kids[i];
      if(k.tagName==="LABEL"&&!k.querySelector("input[type=checkbox],input[type=file]")){
        var fld=document.createElement("div");fld.className="fld";box.insertBefore(fld,k);fld.appendChild(k);i++;
        while(i<kids.length&&(isField(kids[i])||(kids[i].id&&/^(p_cmq)$/.test(kids[i].id)))){fld.appendChild(kids[i]);i++}
        continue;
      }
      if(k.tagName==="DIV"&&!k.classList.contains("top")){
        var labs=k.querySelectorAll(":scope > label");
        if(labs.length===1&&k.firstElementChild&&k.firstElementChild.tagName==="LABEL"&&k.children.length<=3){k.classList.add("fld")}
        else if(labs.length>1){k.classList.add("fgrid");wrap(k)}
      }
      i++;
    }
  };
  wrap(root);
  var back=G.back,top=root.querySelector(".top");
  if(back&&top&&!top.querySelector('[data-act="goback"]')){var b=document.createElement("button");b.setAttribute("data-act","goback");b.textContent="← ย้อนกลับ";b.style.marginLeft="auto";b.style.marginRight="6px";var cl=top.querySelector('[data-act="close"]');top.insertBefore(b,cl)}
}

function shrinkImg(file){return new Promise(function(ok){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<1.5*1048576)return ok(file);
  var u=URL.createObjectURL(file);loadImg(u).then(function(im){URL.revokeObjectURL(u);if(!im)return ok(file);
    var m=2000,sc=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cv.toBlob(function(b){ok(b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file)},"image/jpeg",0.85)})})}
async function filesUp(list,k,id){

  for(var i=0;i<list.length;i++){var f=list[i];

    msg("กำลังอัปโหลด "+(i+1)+"/"+list.length+" …");
    try{var b=await shrinkImg(f);if(b.size>20*1048576){msg(f.name+" ใหญ่เกิน 20 MB");continue}
